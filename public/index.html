<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Test Harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>

    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Modern Test Platform</p>
          <h1>AI Agent Test Harness</h1>
          <p class="subtitle">Run batch prompt tests, compare outputs, and export results.</p>
        </div>
        <button id="themeToggle" class="btn btn-ghost" type="button" aria-label="Toggle theme">Toggle theme</button>
      </header>

      <section class="legend" aria-label="Status legend">
        <span class="legend-item"><span class="dot dot-na"></span> N/A</span>
        <span class="legend-item"><span class="dot dot-executing"></span> Executing</span>
        <span class="legend-item"><span class="dot dot-success"></span> Completed</span>
        <span class="legend-item"><span class="dot dot-failed"></span> Failed</span>
      </section>

      <section class="table-wrap" aria-label="Test table">
        <table id="testsTable">
          <thead>
            <tr>
              <th>Test ID</th>
              <th>Input</th>
              <th>Expected Output</th>
              <th>Actual Output</th>
              <th>Status</th>
              <th>Similarity %</th>
              <th>Run Time</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="testsBody"></tbody>
        </table>
      </section>

      <footer class="controls">
        <input id="fileInput" type="file" accept=".json,.csv,.txt" hidden />
        <button id="loadBtn" class="btn" type="button">Load Data</button>
        <button id="startBtn" class="btn btn-primary" type="button">Start Test</button>
        <button id="stopBtn" class="btn btn-danger" type="button">Stop Test</button>
        <button id="compareBtn" class="btn" type="button">Compare</button>
        <button id="saveBtn" class="btn" type="button">Save Results</button>
      </footer>

      <p id="statusLine" class="status-line">Ready.</p>
    </main>

    <template id="cellTemplate">
      <div class="truncate" title=""></div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
